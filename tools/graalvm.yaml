name: graalvm
description: Oracle GraalVM 25.3 for JDK 25

packages:
  - gcc
  - glibc-devel
  - zlib-devel
  - libstdc++-static

downloads:
  - url: https://gds.oracle.com/download/graal/25i3/latest/graalvm-jdk-25i3-25_linux-x64_bin.tar.gz
    sha256: 814deac144a912035c4e824e05fa06a2e0c83821f0fb9d1084bc916e5eeef247
    extract: /opt
    arch: x86_64
    links:
      /opt/graalvm-25.3.4.1+1.1/bin/native-image: /usr/local/bin/native-image
  - url: https://gds.oracle.com/download/graal/25i3/latest/graalvm-jdk-25i3-25_linux-aarch64_bin.tar.gz
    sha256: aa80a8aa63b0e2ca50946c7fddb77a7d1bf8488a8a3f0175275a3c0e8face20b
    extract: /opt
    arch: aarch64
    links:
      /opt/graalvm-25.3.4.1+1.1/bin/native-image: /usr/local/bin/native-image

env:
  - export GRAALVM_HOME=/opt/graalvm-25.3.4.1+1.1

verify: native-image --version
